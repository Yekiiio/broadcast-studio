<!doctype html>
<html lang="fr" data-overlay="champselect">
<head>
<meta charset="utf-8"><title>Champ select</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Oswald:wght@500;700&family=Inter:wght@500;700&family=Orbitron:wght@600;800&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
  #head { position: absolute; top: 24px; left: 50%; margin-left: -460px; width: 920px; height: 96px; display: grid; grid-template-columns: 1fr 190px 1fr; transform: translateY(-40px); }
  .hteam { --tc: #888; display: flex; align-items: center; gap: 14px; padding: 0 18px; background: rgba(var(--panel-rgb), var(--opacity)); border-bottom: 4px solid var(--tc); position: relative; overflow: hidden; }
  .hteam::before { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, var(--tc), transparent 60%); opacity: .25; }
  .hteam.red { flex-direction: row-reverse; } .hteam.red::before { background: linear-gradient(270deg, var(--tc), transparent 60%); }
  .hteam.blue { border-radius: var(--radius) 0 0 var(--radius); } .hteam.red { border-radius: 0 var(--radius) var(--radius) 0; }
  .hteam > * { position: relative; }
  .hlogo { width: 60px; height: 60px; font-size: 44px; flex: none; }
  .hname { font-size: 30px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hcenter { background: rgba(var(--panel-rgb), 1); border-bottom: 4px solid var(--accent); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #timer { font-size: 48px; font-weight: 800; line-height: 1; } #phase { font-size: 13px; letter-spacing: .08em; white-space: nowrap; text-transform: uppercase; color: var(--muted); margin-top: 4px; text-align: center; padding: 0 6px; }
  #timer.low { color: #f87171; }
  #status { position: absolute; top: 132px; left: 0; right: 0; margin: 0 auto; width: max-content; padding: 6px 26px; font-size: 22px; letter-spacing: .12em; text-transform: uppercase;
    background: rgba(var(--panel-rgb), var(--opacity)); border-radius: var(--radius); border-bottom: 3px solid var(--accent); white-space: nowrap; }
  .side { position: absolute; top: 175px; width: 440px; transition: opacity .6s, transform .6s; opacity: 0; }
  #blue { left: 30px; transform: translateX(-80px); } #red { right: 30px; transform: translateX(80px); }
  body.show .side, body.show #blue, body.show #red { opacity: 1; transform: none; }
  .picks { display: flex; flex-direction: column; gap: 10px; }
  .pick { --tc: #888; height: 140px; position: relative; overflow: hidden; border-radius: var(--radius); background: rgba(var(--panel-rgb), var(--opacity)); border-bottom: 4px solid var(--tc); }
  .pick .art { position: absolute; inset: 0; background: center 22%/cover no-repeat; opacity: 0; transition: opacity .6s, transform 1.2s; transform: scale(1.12); }
  .pick.filled .art { opacity: 1; transform: scale(1); }
  .pick::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.78), rgba(0,0,0,.05) 70%); }
  #red .pick::after { background: linear-gradient(270deg, rgba(0,0,0,.78), rgba(0,0,0,.05) 70%); }
  .pick .txt { position: absolute; z-index: 2; bottom: 12px; left: 18px; right: 18px; }
  #red .pick .txt { text-align: right; }
  .pick .pl { font-size: 17px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); line-height: 1; }
  .pick .ch { font-size: 36px; font-weight: 700; text-transform: uppercase; line-height: 1.05; text-shadow: 0 2px 6px rgba(0,0,0,.7); }
  .pick.active { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 50% { box-shadow: 0 0 22px 2px var(--accent); } }
  .pick.active .ch::after { content: '…'; color: var(--accent); }
  .bans { display: flex; gap: 8px; margin-top: 16px; }
  #red .bans { justify-content: flex-end; }
  .ban { width: 64px; height: 64px; position: relative; border-radius: var(--radius); overflow: hidden; background: rgba(var(--panel-rgb), var(--opacity)); }
  .ban .art { position: absolute; inset: 0; background: center/cover no-repeat; filter: grayscale(1) brightness(.75); }
  .ban.filled::after { content: ''; position: absolute; left: -10%; top: 50%; width: 120%; height: 3px; background: #ef4444; transform: rotate(-45deg); }
  .ban.active { outline: 3px solid var(--accent); animation: pulse 1.1s ease-in-out infinite; }
  .fearless { margin-top: 12px; }
  .fearless small { display: block; font-size: 14px; letter-spacing: .18em; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; }
  #red .fearless small { text-align: right; }
  .fl { display: flex; flex-wrap: wrap; gap: 5px; } #red .fl { justify-content: flex-end; }
  .fl i { width: 40px; height: 40px; border-radius: 6px; background: var(--bg) center/cover; filter: grayscale(1) brightness(.7); display: block; }
</style>
</head>
<body>
<div class="blk" data-block="head" data-origin="960px 24px">
  <div id="head" class="fade-root">
    <div class="hteam banner blue" id="hb"><div class="hlogo" id="hb-logo"></div><div class="hname" id="hb-name"></div></div>
    <div class="hcenter"><div id="timer" class="num" data-comp="timer">--</div><div id="phase" data-comp="phase"></div></div>
    <div class="hteam banner red" id="hr"><div class="hlogo" id="hr-logo"></div><div class="hname" id="hr-name"></div></div>
  </div>
</div>
<div class="blk" data-block="status" data-origin="960px 132px"><div id="status" class="fade-root"></div></div>
<div class="blk" data-block="blue" data-origin="30px 175px"><div class="side" id="blue"><div class="picks"></div><div class="bans" data-comp="bans"></div><div class="fearless" data-comp="fearless"><small>Fearless</small><div class="fl"></div></div></div></div>
<div class="blk" data-block="red" data-origin="1890px 175px"><div class="side" id="red"><div class="picks"></div><div class="bans" data-comp="bans"></div><div class="fearless" data-comp="fearless"><small>Fearless</small><div class="fl"></div></div></div></div>
<script src="shared.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const els = { blue: { picks: [], bans: [] }, red: { picks: [], bans: [] } };
  for (const side of ['blue', 'red']) {
    const root = $(side);
    for (let i = 0; i < 5; i++) {
      const p = document.createElement('div'); p.className = 'pick banner';
      p.innerHTML = '<div class="art"></div><div class="txt"><div class="pl" data-comp="playernames"></div><div class="ch"></div></div>';
      root.querySelector('.picks').appendChild(p);
      els[side].picks.push({ p, art: p.querySelector('.art'), pl: p.querySelector('.pl'), ch: p.querySelector('.ch') });
      const b = document.createElement('div'); b.className = 'ban'; b.innerHTML = '<div class="art"></div>';
      root.querySelector('.bans').appendChild(b);
      els[side].bans.push({ b, art: b.querySelector('.art') });
    }
  }

  function phaseLabel(step) {
    if (step <= 5) return 'Bans — phase 1';
    if (step <= 11) return 'Picks — phase 1';
    if (step <= 15) return 'Bans — phase 2';
    if (step <= 19) return 'Picks — phase 2';
    return 'Terminé';
  }
  let timerEnd = 0;

  Overlay.onState((s) => {
    const d = s.draft;
    timerEnd = d.timerEnd;
    const cur = d.step < d.order.length ? d.order[d.step] : null;
    for (const side of ['blue', 'red']) {
      const team = Overlay.team(side);
      const hs = $(side === 'blue' ? 'hb' : 'hr');
      hs.style.setProperty('--tc', team.color);
      Overlay.teamBanner(hs, team);
      Overlay.html($(side === 'blue' ? 'hb-logo' : 'hr-logo'), Overlay.logoHTML(team));
      Overlay.text($(side === 'blue' ? 'hb-name' : 'hr-name'), team.name);
      $(side).style.setProperty('--tc', team.color);
      const firstEmpty = (arr) => arr.indexOf(null);
      els[side].picks.forEach((o, i) => {
        const id = d[side].picks[i];
        o.p.style.setProperty('--tc', team.color);
        Overlay.teamBanner(o.p, team);
        o.p.classList.toggle('filled', !!id);
        o.p.classList.toggle('active', !!cur && cur.side === side && cur.type === 'pick' && firstEmpty(d[side].picks) === i);
        Overlay.bg(o.art, Overlay.splash(id));
        Overlay.text(o.pl, team.players[i] || '');
        Overlay.text(o.ch, id ? Overlay.champName(id) : '');
      });
      els[side].bans.forEach((o, i) => {
        const id = d[side].bans[i];
        o.b.classList.toggle('filled', !!id);
        o.b.classList.toggle('active', !!cur && cur.side === side && cur.type === 'ban' && firstEmpty(d[side].bans) === i);
        Overlay.bg(o.art, Overlay.square(id));
      });
      const fl = (d.fearless?.[side] || []);
      const flEl = $(side).querySelector('.fl');
      Overlay.html(flEl, fl.map((id) => `<i title="${Overlay.esc(id)}" style="background-image:url('${Overlay.square(id)}')"></i>`).join(''));
      $(side).querySelector('.fearless').style.display = fl.length ? '' : 'none';
    }
    Overlay.text($('phase'), phaseLabel(d.step));
    if (cur) {
      const t = Overlay.team(cur.side);
      Overlay.text($('status'), `${t.name} ${cur.type === 'ban' ? 'bannit' : 'choisit'}`);
    } else Overlay.text($('status'), 'Draft terminé');
  });

  setInterval(() => {
    const t = $('timer');
    if (!timerEnd) { Overlay.text(t, '--'); t.classList.remove('low'); return; }
    const left = Math.max(0, Math.ceil((timerEnd - Date.now()) / 1000));
    Overlay.text(t, left);
    t.classList.toggle('low', left <= 5);
  }, 200);
</script>
</body>
</html>
